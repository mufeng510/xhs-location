[versions]
agp = "8.4.0"
kotlin = "1.9.23"
hilt = "2.50"
composeBom = "2024.04.00"
composeCompiler = "1.5.12"
activityCompose = "1.8.2"
lifecycleViewmodel = "2.7.0"
lifecycleRuntimeCompose = "2.6.2"
androidxCoreKtx = "1.12.0"
datastore = "1.1.0"
retrofit = "2.9.0"
okhttp = "4.12.0"
okhttpLogging = "4.12.0"
maplibre = "10.2.0"
junit = "4.13.2"
robolectric = "4.11"
mockk = "1.13.8"
truth = "1.1.5"

[plugins]
android-application = { id = "com.android.application", version = "8.2.0" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "1.9.20" }
hilt-android = { id = "com.google.dagger.hilt.android", version = "2.50" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCoreKtx" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodel" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.7.7" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.1.0" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version = "1.6.2" }
androidx-container = { group = "androidx.activity", name = "activity", version = "1.8.2" }
material3 = { group = "com.google.android.material", name = "material", version = "1.11.0" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version = "1.7.0" }
androidx-test-core = { group = "androidx.test", name = "core", version = "1.5.0" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.5.0" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.1.5" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttpLogging" }
gson = { group = "com.google.code.gson", name = "gson", version = "2.10.1" }

maplibre-android = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
